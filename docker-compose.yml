services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      - auth
    volumes:
      # Logs de acceso diarios; sobreviven a los redespliegues (15 días)
      - portal-logs:/var/log/nginx/portal
    logging:
      # Lo que sale por stdout (`docker logs`): solo un respaldo corto
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-15}
      # El token de la API vive solo aquí: nginx lo agrega a cada llamada a /api
      API_PROVIDER_TOKEN: ${API_PROVIDER_TOKEN:?falta API_PROVIDER_TOKEN}
      API_UPSTREAM: ${API_UPSTREAM:-https://apisvanguardia.com:400}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Valida las contraseñas de los perfiles CRABI y SALES FORCE. Las contraseñas
  # y la llave se cargan como variables de entorno del despliegue (Coolify);
  # sin ellas el servicio no arranca.
  auth:
    build: ./auth
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?falta AUTH_SECRET}
      PASSWORD_CRABI: ${PASSWORD_CRABI:?falta PASSWORD_CRABI}
      PASSWORD_SALES_FORCE: ${PASSWORD_SALES_FORCE:?falta PASSWORD_SALES_FORCE}
      SESSION_HOURS: ${SESSION_HOURS:-8}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"

volumes:
  portal-logs:
