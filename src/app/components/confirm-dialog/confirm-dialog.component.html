<h2 mat-dialog-title class="confirm-title">{{ data.title }}</h2>

<mat-dialog-content class="confirm-content">
  <p *ngFor="let line of data.lines">{{ line }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="confirm-actions">
  <button type="button" class="confirm-btn confirm-btn--secondary" (click)="cancel()">
    {{ data.cancelLabel || 'Cancelar' }}
  </button>
  <button type="button" class="confirm-btn confirm-btn--primary" (click)="confirm()">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
