<div class="filter-bar-wrapper px-[2rem] py-5">
  <form [formGroup]="filterForm" (ngSubmit)="onFilter()">
    <div class="filter-bar">

      <!-- Identificador del registro -->
      <div class="filter-field">
        <label for="honda-sf-record">No.Registro</label>
        <input id="honda-sf-record" type="text" formControlName="record_id" placeholder="Número de registro" />
      </div>

      <!-- VIN -->
      <div class="filter-field">
        <label for="honda-sf-vin">VIN</label>
        <input id="honda-sf-vin" type="text" formControlName="vin" placeholder="VIN" />
      </div>

      <!-- Dropdown: Objeto de Salesforce -->
      <details class="dropdown">
        <summary class="dropdown-trigger">
          {{ selectedObject || 'Objeto SF' }}
          <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </summary>
        <div class="dropdown-panel">
          <label class="checkbox" *ngFor="let sfObject of sfObjects">
            <input
              type="checkbox"
              [checked]="selectedObject === sfObject"
              (change)="onObjectToggle(sfObject, $event); closeDropdown($event)" />
            {{ sfObject }}
          </label>
        </div>
      </details>

      <!-- Dropdown: Estado de sincronización -->
      <details class="dropdown">
        <summary class="dropdown-trigger">
          {{ selectedStatus || 'Sincronización' }}
          <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </summary>
        <div class="dropdown-panel">
          <label class="checkbox" *ngFor="let status of syncStatuses">
            <input
              type="checkbox"
              [checked]="selectedStatus === status"
              (change)="onStatusToggle(status, $event); closeDropdown($event)" />
            {{ status }}
          </label>
        </div>
      </details>

      <div class="flex gap-2">
        <!-- Botón Buscar -->
        <button type="submit" class="filter-btn" title="Aplicar filtros">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>

        <!-- Botón Limpiar -->
        <button
          type="button"
          class="clear-btn"
          (click)="onClearFilters()"
          title="Limpiar filtros"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c0-1-1-2-1-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>

        <!-- Botón de Excel -->
        <button
          type="button"
          class="excel-icon-btn"
          (click)="downloadRequested.emit()"
          [disabled]="isDownloadingExcel"
          aria-label="Descargar Excel"
          [title]="isDownloadingExcel ? 'Descargando...' : 'Descargar Excel'"
        >
          <div *ngIf="isDownloadingExcel" class="spinner-small"></div>
          <img *ngIf="!isDownloadingExcel" src="assets/img/excel.png" alt="Excel Icon" class="w-[36px] h-[36px]" />
        </button>
      </div>
    </div>
  </form>
</div>
