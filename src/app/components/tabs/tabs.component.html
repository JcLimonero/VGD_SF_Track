<div class="tabs-wrap px-4 sm:px-8 py-4">
    <ul class="ui-tabs" role="tablist">
        <li *ngFor="let tab of tabs"
            class="ui-tab"
            role="tab"
            [class.active-tab]="isActive(tab.id)"
            [attr.aria-selected]="isActive(tab.id)"
            (click)="selectTab(tab.id)">
            <span class="material-symbols-outlined icon-tab">{{ tab.icon }}</span>
            <span class="tab-label">{{ tab.label }}</span>
        </li>
    </ul>
</div>
