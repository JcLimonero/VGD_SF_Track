<div class="flex justify-center px-4 sm:px-6 lg:px-[4rem] xl:px-[10rem]">
    <div class="tab w-full flex justify-center px-2 sm:px-4 pt-2 sm:pt-4 pb-1 rounded-t-2xl bg-white overflow-x-auto">
        <ul class="w-full flex justify-between text-[0.75rem] sm:text-[1rem] text-[#848484]">
            <li *ngFor="let tab of tabs"
                class="flex flex-col items-center cursor-pointer transition-colors duration-200 hover:text-blue-600 flex-1 min-w-0"
                [class.active-tab]="isActive(tab.id)"
                (click)="selectTab(tab.id)">
                <span class="material-symbols-outlined icon-tab">{{ tab.icon }}</span>
                <span class="text-center text-[0.65rem] sm:text-[0.8rem] lg:text-[1rem] whitespace-nowrap">{{ tab.label }}</span>
            </li>
        </ul>
    </div>
</div>
