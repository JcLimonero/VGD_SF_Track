name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empuja varias veces al mismo PR, solo corre la ejecución más reciente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "VGD SF Track: typecheck, tests y build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Karma usa el Chrome que descarga puppeteer (ver karma.conf.js), así no
      # se depende de que el runner traiga un Chrome compatible preinstalado.
      - name: Instalar Chrome para las pruebas
        run: npx puppeteer browsers install chrome

      # Se audita solo lo que llega al navegador (--omit=dev). Las herramientas
      # de construcción no viajan en el bundle y su ruido tapaba lo que sí
      # importa: 94 avisos contando dev, 8 sin contarlo.
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev || true

      # Corta solo en crítica, no en alta.
      #
      # Tras subir a Angular 20 la única vulnerabilidad de producción que queda
      # es `xlsx`, alta y SIN arreglo publicado: el paquete está abandonado en
      # npm y 0.18.5 es su última versión. Cortar en alta dejaría el CI en rojo
      # permanente por algo que hoy no se puede arreglar, y un CI siempre rojo
      # equivale a no tener auditoría.
      #
      # Aquí solo se ESCRIBEN archivos con xlsx, nunca se parsean archivos
      # ajenos, así que la explotabilidad real es baja. Si se migra al paquete
      # que publica SheetJS, bajar este umbral a `high`.
      - name: Bloquear vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:ci

      - name: Build de producción
        run: npm run build

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # El portal es un proyecto npm aparte (carpeta portal/), con sus propias
  # dependencias y su propio build. Va en un job separado para que un fallo suyo
  # no se confunda con uno de la aplicación principal, y para que ambos corran
  # en paralelo.
  portal:
    name: "DS Monitor · portal: formato, tipos y build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npm run format:check

      - name: Verificar tipos
        run: npm run typecheck

      # El build hace la revisión de tipos de las plantillas, que tsc no ve.
      - name: Build de producción
        run: npm run build

  # El puente es el tercer proyecto npm del repositorio: guarda las credenciales
  # y traduce cada API al modelo del portal. Va en su propio job por lo mismo que
  # el portal: para que un fallo suyo no se confunda con los otros.
  puente:
    name: "DS Monitor · puente: formato, tipos, contrato y pruebas"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: puente

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: puente/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npm run format:check

      - name: Verificar tipos
        run: npm run typecheck

      # Comprueba que los tipos del puente sigan siendo los mismos que los del
      # portal. Si alguien cambia un campo de un solo lado, esto deja de compilar.
      - name: Verificar el contrato con el portal
        run: npm run check:contrato

      - name: Pruebas
        run: npm test
