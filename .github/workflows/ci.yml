name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empuja varias veces al mismo PR, solo corre la ejecución más reciente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Karma usa el Chrome que descarga puppeteer (ver karma.conf.js), así no
      # se depende de que el runner traiga un Chrome compatible preinstalado.
      - name: Instalar Chrome para las pruebas
        run: npx puppeteer browsers install chrome

      # Se audita solo lo que llega al navegador (--omit=dev). Las herramientas
      # de construcción no viajan en el bundle y su ruido tapaba lo que sí
      # importa: 94 avisos contando dev, 8 sin contarlo.
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev || true

      # Corta solo en crítica, no en alta. Hoy las altas de producción son de
      # @angular/* y no tienen arreglo dentro de Angular 17: el aviso cubre
      # hasta 19.2.25 y la última 17.x es la 17.3.12. Cortar en alta dejaría
      # el CI en rojo permanente, que equivale a no tener auditoría.
      # Cuando se suba Angular, bajar este umbral a `high`.
      - name: Bloquear vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:ci

      - name: Build de producción
        run: npm run build

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
